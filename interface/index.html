<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7c5cff">
<meta name="description" content="IA TODO: tu asistente de inteligencia artificial">
<link rel="manifest" href="/manifest.json">
<title>IA TODO — Tu asistente para todo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
:root{--bg:#0a0a12;--surface:#12121e;--surface2:#1a1a2a;--border:rgba(255,255,255,.09);--text:#e8e8f0;--muted:#8888a0;--accent:#7c5cff;--accent2:#00d4ff;--ok:#00e5a0;--danger:#ff5c7a}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;background:rgba(18,18,30,.96);border-bottom:1px solid var(--border);gap:10px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:1.4rem}.brand h1{font-size:1.1rem;margin:0}.brand p{font-size:.75rem;color:var(--muted);margin:4px 0 0}.status{display:flex;align-items:center;gap:7px;font-size:.78rem;color:var(--ok);background:rgba(0,229,160,.08);padding:7px 11px;border-radius:20px;border:1px solid rgba(0,229,160,.2);white-space:nowrap}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.status.off{color:#ffb84d;border-color:rgba(255,184,77,.3)}
#chat{flex:1;overflow-y:auto;padding:22px max(14px,calc((100% - 900px)/2)) 18px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}.msg{max-width:100%;display:flex;gap:10px;align-items:flex-start}.msg.user{align-self:flex-end;flex-direction:row-reverse;max-width:90%}.avatar{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:linear-gradient(135deg,var(--accent),var(--accent2))}.msg.user .avatar{background:var(--surface2);border:1px solid var(--border)}.bubble{max-width:min(760px,calc(100vw - 90px));padding:12px 15px;border-radius:16px;line-height:1.58;font-size:.94rem;white-space:pre-wrap;overflow-wrap:anywhere}.msg.bot .bubble{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}.msg.user .bubble{background:linear-gradient(135deg,#5a3fd4,var(--accent));border-bottom-right-radius:4px;color:white}.bubble pre{white-space:pre;overflow-x:auto;background:#07070d;border:1px solid var(--border);padding:12px;border-radius:10px;font-size:.85rem}.bubble code{background:rgba(255,255,255,.1);padding:1px 5px;border-radius:4px}.bubble a{color:#9ddcff}.generated-image{display:block;width:100%;max-width:640px;height:auto;margin:12px 0;border-radius:12px;border:1px solid var(--border);background:#090912}.image-loading{color:var(--muted);font-size:.85rem}.media-preview{max-width:min(360px,100%);max-height:360px;object-fit:contain;border-radius:10px;margin-top:8px;display:block}.source{margin-top:9px;font-size:.8rem;color:var(--muted)}.suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}.chip{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:8px 12px;border-radius:20px;font-size:.82rem;cursor:pointer}.chip:hover,.tool-btn:hover{border-color:rgba(124,92,255,.6);color:#fff;background:rgba(124,92,255,.18)}
.typing{display:none;gap:10px;padding:0 16px 10px}.typing.show{display:flex}.typing .bubble{display:flex;gap:5px;background:var(--surface);border:1px solid var(--border)}.typing .d{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite}.typing .d:nth-child(2){animation-delay:.15s}.typing .d:nth-child(3){animation-delay:.3s}@keyframes b{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.input-area{padding:10px max(12px,calc((100% - 900px)/2)) 15px;background:rgba(18,18,30,.97);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:9px}.tools{display:flex;gap:8px;flex-wrap:wrap}.tool-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-size:1.05rem;cursor:pointer}.tool-btn.on{background:rgba(124,92,255,.25);border-color:rgba(124,92,255,.6);color:white}.input-row{display:flex;gap:10px;align-items:flex-end}.input-wrap{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:4px 12px 4px 15px;display:flex}.input-wrap:focus-within{border-color:rgba(124,92,255,.7)}#input{flex:1;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:.95rem;padding:10px 0;max-height:130px;resize:none;line-height:1.4}#send{width:46px;height:46px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--accent),#5a3fd4);color:white;font-size:1.2rem;cursor:pointer}#send:disabled{opacity:.5;cursor:not-allowed}.hint{font-size:.72rem;color:var(--muted);text-align:center}input[type=file]{display:none}button:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
@media(max-width:600px){header{padding:10px 12px}.brand h1{font-size:1rem}.brand p{font-size:.68rem}.logo{width:37px;height:37px}.status{font-size:.7rem;padding:6px 8px}#chat{padding:15px 10px}.bubble{font-size:.9rem;max-width:calc(100vw - 70px)}.msg.user{max-width:95%}.input-area{padding:9px 10px 12px}.tools{gap:6px}.tool-btn{width:36px;height:36px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">∞</div><div><h1>IA TODO</h1><p>Tu asistente para todo tipo de cosas</p></div></div><div class="status" id="status"><span class="dot"></span><span id="statusTxt">Conectando…</span></div></header>
<main id="chat" aria-live="polite"></main>
<div class="typing" id="typing"><div class="avatar">∞</div><div class="bubble"><span class="d"></span><span class="d"></span><span class="d"></span></div></div>
<div class="input-area"><div class="tools">
<button class="tool-btn" id="btnMic" title="Hablar" aria-label="Hablar">🎤</button><button class="tool-btn" id="btnCamera" title="Tomar o enviar foto" aria-label="Tomar foto">📷</button><button class="tool-btn" id="btnFile" title="Adjuntar documento de texto" aria-label="Adjuntar documento">📄</button><button class="tool-btn" id="btnVoz" title="Leer respuestas en voz alta" aria-label="Voz">🔊</button><button class="tool-btn" id="btnNuevo" title="Nueva conversación" aria-label="Nueva conversación">🗑️</button>
</div><div class="input-row"><div class="input-wrap"><textarea id="input" rows="1" placeholder="Pregúntame, pide una imagen o escribe ‘busca en internet…’" autofocus></textarea></div><button id="send" title="Enviar" aria-label="Enviar">➤</button></div><div class="hint">IA TODO puede cometer errores. No compartas contraseñas ni datos privados.</div></div>
<input type="file" id="fileInput" accept=".txt,.md,.csv,.json,.py,.html,.css,.js,.xml,.yaml,.yml,.log,text/plain,text/csv,application/json">
<input type="file" id="cameraInput" accept="image/*" capture="environment">
<script src="/static/script.js" defer></script>
</body>
</html>
