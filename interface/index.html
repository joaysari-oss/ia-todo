
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101522">
    <title>IA TODO</title>

    <style>
        :root {
            --fondo: #101522;
            --panel: #171e2d;
            --panel2: #222c40;
            --texto: #f5f7fb;
            --suave: #aab5c7;
            --borde: #303c51;
            --morado: #7657ed;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--fondo);
            color: var(--texto);
            font-family: Arial, sans-serif;
        }

        button, textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .app {
            display: flex;
            height: 100dvh;
        }

        .sidebar {
            width: 280px;
            flex-shrink: 0;
            background: #0c1220;
            border-right: 1px solid var(--borde);
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 15px;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
            padding: 8px 4px;
        }

        .nuevo {
            background: var(--morado);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 13px;
            text-align: left;
        }

        .etiqueta {
            font-size: 12px;
            color: var(--suave);
            margin-top: 8px;
        }

        #chatList {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .chat-row {
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 4px;
            border-radius: 9px;
        }

        .chat-row.active {
            background: var(--panel2);
        }

        .chat-open {
            flex: 1;
            min-width: 0;
            background: transparent;
            color: var(--texto);
            border: none;
            text-align: left;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 9px 5px;
        }

        .icon-btn {
            border: none;
            background: transparent;
            color: var(--texto);
            border-radius: 7px;
            min-width: 32px;
            height: 32px;
        }

        .icon-btn:hover {
            background: #344159;
        }

        .creator {
            background: #1a2334;
            color: #ffd65a;
            border: 1px solid var(--borde);
            border-radius: 10px;
            padding: 12px;
            text-align: left;
        }

        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            padding: 17px 20px;
            border-bottom: 1px solid var(--borde);
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        #statusText {
            color: #83e6b2;
            font-size: 13px;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 22px max(16px, calc((100% - 800px) / 2));
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .welcome {
            margin: auto;
            text-align: center;
            color: var(--suave);
            max-width: 600px;
        }

        .welcome h1 {
            color: var(--texto);
            font-size: 35px;
        }

        .bubble {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.6;
            padding: 14px 16px;
            border-radius: 15px;
        }

        .bubble.user {
            align-self: flex-end;
            max-width: 85%;
            background: #303b52;
        }

        .bubble.assistant {
            background: var(--panel);
            border: 1px solid var(--borde);
        }

        .composer-wrap {
            padding: 12px 18px 18px;
            border-top: 1px solid var(--borde);
        }

        .composer {
            max-width: 850px;
            margin: auto;
            background: var(--panel);
            border: 1px solid var(--borde);
            border-radius: 16px;
            padding: 10px;
        }

        #messageInput {
            width: 100%;
            min-height: 65px;
            max-height: 180px;
            resize: vertical;
            background: transparent;
            color: var(--texto);
            border: none;
            outline: none;
            padding: 8px;
        }

        .tools {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            align-items: center;
        }

        .tool-btn {
            background: #273249;
            color: white;
            border: 1px solid var(--borde);
            border-radius: 9px;
            padding: 9px;
        }

        #sendBtn {
            margin-left: auto;
            background: var(--morado);
            color: white;
            border: none;
            border-radius: 9px;
            padding: 10px 16px;
        }

        #attachmentNote {
            color: var(--suave);
            font-size: 12px;
            padding: 4px;
        }

        input[type="file"] {
            display: none;
        }

        @media (max-width: 650px) {
            .sidebar {
                width: 75px;
                padding: 7px;
            }

            .logo {
                font-size: 15px;
                text-align: center;
            }

            .nuevo {
                text-align: center;
                font-size: 0;
                padding: 12px 3px;
            }

            .nuevo::before {
                content: "+";
                font-size: 23px;
            }

            .etiqueta, .chat-open, .creator-text {
                display: none;
            }

            .chat-row {
                justify-content: center;
                flex-wrap: wrap;
            }

            .creator {
                text-align: center;
                padding: 10px 3px;
            }

            .topbar {
                padding: 12px;
                flex-wrap: wrap;
            }

            #messages {
                padding: 14px 10px;
            }

            .composer-wrap {
                padding: 8px;
            }
        }
    </style>
</head>

<body>
<div class="app">

    <aside class="sidebar">
        <div class="logo">✨ IA TODO</div>

        <button class="nuevo" id="newChatBtn">
            + Nueva conversación
        </button>

        <div class="etiqueta">HISTORIAL</div>
        <div id="chatList"></div>

        <button class="creator" id="creatorBtn">
            ★ <span class="creator-text">Modo creador</span>
        </button>
    </aside>

    <main class="main">
        <header class="topbar">
            <strong id="currentTitle">Nueva conversación</strong>
            <span id="statusText">● En línea</span>
        </header>

        <section id="messages" aria-live="polite">
            <div class="welcome">
                <h1>¿En qué te ayudo hoy?</h1>
                <p>Pregunta lo que quieras a IA TODO.</p>
            </div>
        </section>

        <div class="composer-wrap">
            <div class="composer">
                <textarea
                    id="messageInput"
                    placeholder="Escribe tu mensaje..."
                    rows="2"
                ></textarea>

                <div id="attachmentNote"></div>

                <div class="tools">
                    <button class="tool-btn" id="imageBtn">📷 Foto</button>
                    <button class="tool-btn" id="fileBtn">📎 Archivo</button>
                    <button class="tool-btn" id="micBtn">🎙️ Dictar</button>
                    <button class="tool-btn" id="speakBtn">🔊 Leer</button>
                    <button id="sendBtn">Enviar ↑</button>
                </div>

                <input id="imageInput" type="file" accept="image/*">
                <input id="fileInput" type="file" accept=".txt,.md,.csv,.json,.xml,.html,.py,.js,.css">
            </div>
        </div>
    </main>
</div>

<script src="/static/script.js"></script>
</body>
</html>
