<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IA Asistente - Joao</title>
    <style>
        /* Estilos sencillos para que se vea ordenado */
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; }
        #chat-container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        #mensajes { height: 300px; overflow-y: scroll; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; }
        .controles { display: flex; gap: 5px; align-items: center; }
        input[type="text"] { flex: 1; padding: 10px; }
        button, label { padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        label { background: #6c757d; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div id="chat-container">
    <h2>Asistente de Inteligencia Artificial</h2>
    <div id="mensajes"></div>
    
    <div class="controles">
        <!-- Botón para adjuntar archivos (Imágenes o PDF) -->
        <label for="archivo-input">📁</label>
        <input type="file" id="archivo-input" accept="image/*,application/pdf">

        <!-- Botón para activar el micrófono -->
        <button id="btn-mic" type="button">🎤</button>

        <!-- Campo de texto normal -->
        <input type="text" id="mensaje-input" placeholder="Escribe tu mensaje...">
        
        <!-- Botón de enviar -->
        <button id="btn-enviar" type="button">Enviar</button>
    </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
