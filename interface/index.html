
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111318">
  <title>IA TODO</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    :root {
      color-scheme: dark;
      --fondo: #111318;
      --panel: #191c23;
      --borde: #30343d;
      --texto: #f5f6fa;
      --secundario: #a4a9b5;
      --acento: #7657f6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      background: var(--fondo);
      color: var(--texto);
      font-family: Arial, sans-serif;
    }

    button, textarea { font: inherit; }
    button { cursor: pointer; }

    .sidebar {
      width: 255px;
      flex-shrink: 0;
      background: #171920;
      border-right: 1px solid var(--borde);
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .logo {
      padding: 8px 10px 18px;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: .4px;
    }

    .logo span { color: #9a85ff; }

    .nuevo, .sidebar button, .icon-btn {
      color: var(--texto);
      background: transparent;
      border: 1px solid var(--borde);
      border-radius: 11px;
      padding: 11px;
      text-align: left;
    }

    .nuevo {
      background: var(--acento);
      border-color: var(--acento);
      text-align: center;
      font-weight: 700;
    }

    .historial-titulo {
      color: var(--secundario);
      font-size: 12px;
      margin: 17px 8px 5px;
    }

    #listaChats {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .chat-item .abrir-chat {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      border-color: transparent;
    }

    .chat-item.activo .abrir-chat {
      background: #292d38;
    }

    .eliminar {
      border: 0 !important;
      color: #ff8b8b !important;
      padding: 9px !important;
    }

    .pie-sidebar {
      margin-top: auto;
      padding: 10px;
      color: var(--secundario);
      font-size: 12px;
    }

    .principal {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    header {
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--borde);
    }

    .estado {
      font-size: 12px;
      color: #9de4b3;
    }

    #mensajes {
      flex: 1;
      overflow-y: auto;
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      padding: 26px 20px;
    }

    .bienvenida {
      text-align: center;
      margin: 12vh auto 30px;
    }

    .bienvenida h1 { font-size: 32px; }
    .bienvenida p { color: var(--secundario); }

    .mensaje {
      display: flex;
      margin: 18px 0;
      gap: 12px;
      line-height: 1.65;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #292d38;
      flex-shrink: 0;
    }

    .contenido {
      min-width: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .mensaje.usuario .avatar {
      background: var(--acento);
    }

    .contenido img {
      max-width: min(100%, 360px);
      max-height: 320px;
      border-radius: 12px;
      display: block;
      margin-top: 8px;
    }

    .zona-escritura {
      width: 100%;
      padding: 12px 18px 18px;
      border-top: 1px solid var(--borde);
    }

    .compositor {
      max-width: 850px;
      margin: 0 auto;
      border: 1px solid #414550;
      border-radius: 17px;
      background: var(--panel);
      padding: 12px;
    }

    #mensaje {
      width: 100%;
      min-height: 48px;
      max-height: 180px;
      resize: vertical;
      color: var(--texto);
      background: transparent;
      border: 0;
      outline: none;
      padding: 8px;
    }

    .acciones {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .acciones button {
      border: 1px solid var(--borde);
      border-radius: 9px;
      background: #242832;
      color: var(--texto);
      padding: 9px 11px;
    }

    .acciones .enviar {
      margin-left: auto;
      background: var(--acento);
      border-color: var(--acento);
      font-weight: 700;
    }

    #archivoNombre {
      color: var(--secundario);
      font-size: 12px;
      padding: 5px;
    }

    .nota {
      text-align: center;
      color: var(--secundario);
      font-size: 11px;
      margin: 10px 0 0;
    }

    #menuBtn { display: none; }

    @media (max-width: 700px) {
      .sidebar {
        position: fixed;
        z-index: 5;
        inset: 0 auto 0 0;
        transform: translateX(-100%);
        transition: transform .2s;
        box-shadow: none;
      }

      .sidebar.abierta {
        transform: translateX(0);
        box-shadow: 0 0 0 100vmax #0009;
      }

      #menuBtn { display: inline-block; }
      header { padding: 10px 12px; }
      #mensajes { padding: 18px 13px; }
      .zona-escritura { padding: 10px; }
      .bienvenida h1 { font-size: 25px; }
    }
  </style>
</head>

<body>
  <aside class="sidebar" id="sidebar">
    <div class="logo">IA <span>TODO</span></div>

    <button class="nuevo" id="nuevoChat">＋ Nueva conversación</button>

    <div class="historial-titulo">TUS CONVERSACIONES</div>
    <div id="listaChats"></div>

    <div class="pie-sidebar">IA TODO · Asistente inteligente</div>
  </aside>

  <main class="principal">
    <header>
      <div style="display:flex;align-items:center;gap:12px">
        <button class="icon-btn" id="menuBtn" aria-label="Abrir menú">☰</button>
        <strong>IA TODO</strong>
      </div>
      <span class="estado" id="estado">● Lista para ayudarte</span>
    </header>

    <section id="mensajes" aria-live="polite">
      <div class="bienvenida" id="bienvenida">
        <h1>¿En qué te puedo ayudar?</h1>
        <p>Pregunta, escribe, adjunta una imagen o dicta tu mensaje.</p>
      </div>
    </section>

    <section class="zona-escritura">
      <div class="compositor">
        <textarea id="mensaje" placeholder="Escribe tu mensaje..." rows="2"></textarea>

        <div id="archivoNombre"></div>

        <div class="acciones">
          <button id="fotoBtn" type="button">🖼️ Foto</button>
          <button id="archivoBtn" type="button">📎 Archivo</button>
          <button id="dictarBtn" type="button">🎙️ Dictar</button>
          <button id="leerBtn" type="button">🔊 Leer</button>
          <button id="compartirBtn" type="button">↗ Compartir</button>
          <button id="borrarAdjuntoBtn" type="button">✕ Quitar archivo</button>
          <button class="enviar" id="enviarBtn" type="button">Enviar ↑</button>
        </div>

        <input id="imagenInput" type="file" accept="image/*" hidden>
        <input id="archivoInput" type="file" accept=".txt,.md,.csv,.json,.py,.html,.css,.js" hidden>
      </div>
      <p class="nota">Comprueba la información importante. Las respuestas pueden contener errores.</p>
    </section>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
